name: Function claims

on:
  issues:
    types: [opened, reopened, edited, closed]
  push:
    branches: [main]
    paths: ['reconstructions/**']
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: function-claims
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Reconcile all pending and expired claims
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/community.py reconcile
