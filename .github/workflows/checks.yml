name: Verify reconstructions

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [master]
  workflow_dispatch:
  repository_dispatch:
    types: [automerged]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ github.event_name == 'workflow_dispatch' && 'verify-maintenance' || 'verify' }}
    permissions:
      contents: read
      actions: read
    outputs:
      report: ${{ steps.match.outputs.report }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      # A PR is checked as GitHub's test merge into current master, so files that
      # changed on master after the PR branched do not count as PR changes.
      - name: Check out candidate as data
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request && format('refs/pull/{0}/merge', github.event.pull_request.number) || github.sha }}
          fetch-depth: 2
          path: candidate
          persist-credentials: false
      - name: Resolve trusted base
        id: base
        run: |
          if [ "${{ github.event_name }}" = pull_request_target ]; then
            echo "sha=$(git -C candidate rev-parse HEAD^1)" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Check out trusted verifier
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ steps.base.outputs.sha }}
          path: trusted
          persist-credentials: false
      - name: Install PowerPC compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y clang-18 llvm-18 libclang1-18 libzstd-dev lld-18
      - name: Install hash-pinned GHS toolchain
        run: python3 trusted/tools/toolchain.py
      - name: Test trusted verifier
        working-directory: trusted
        env:
          PYTHONPATH: src
        run: PATH="/usr/lib/llvm-18/bin:$PATH" python3 -m unittest discover -s tests -v
      - name: Match candidate sources against trusted references
        id: match
        working-directory: trusted
        env:
          CHANGED_ONLY: ${{ github.event_name == 'pull_request_target' && '--changed-only' || '' }}
        run: python3 tools/ci.py --candidate "$GITHUB_WORKSPACE/candidate" --compiler clang++-18 $CHANGED_ONLY
      - name: Check candidate C++ declarations
        working-directory: trusted
        run: python3 tools/contract_audit.py --root "$GITHUB_WORKSPACE/candidate" --reference-root "$GITHUB_WORKSPACE/trusted" --compiler clang++-18 --strict --summary
      - name: Check semantic-name catalog
        working-directory: trusted
        run: python3 tools/symbols.py --root "$GITHUB_WORKSPACE/candidate" check
      - name: Check the linked code and data component
        working-directory: trusted
        run: PATH="/usr/lib/llvm-18/bin:$PATH" python3 tools/check_linked_component.py --root "$GITHUB_WORKSPACE/candidate" --compiler clang++-18

  publish-progress:
    needs: verify
    if: github.ref == 'refs/heads/master' && github.ref_protected && (github.event_name == 'push' || github.event_name == 'repository_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Publish verified totals
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT: ${{ needs.verify.outputs.report }}
          PYTHONPATH: src
        run: |
          master_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq .object.sha)
          if [[ ! "$master_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "GitHub did not return a valid master commit."
            exit 1
          fi
          if [[ "$master_sha" != "$GITHUB_SHA" ]]; then
            echo "A newer master commit is awaiting verification."
            exit 0
          fi
          progress_dir=$(mktemp -d)
          export PROGRESS_DIR="$progress_dir"
          remote="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          gh auth setup-git --hostname github.com
          git -C "$progress_dir" init -q
          git -C "$progress_dir" remote add origin "$remote"
          if git -C "$progress_dir" ls-remote --exit-code origin refs/heads/progress >/dev/null; then
            git -C "$progress_dir" fetch --depth=1 origin refs/heads/progress
            if [[ $(git -C "$progress_dir" ls-tree --name-only FETCH_HEAD) != $'exact-text.svg\nprogress.json' ]]; then
              echo "The progress branch contains unexpected files."
              exit 1
            fi
            git -C "$progress_dir" reset -q --mixed FETCH_HEAD
          elif [[ $? != 2 ]]; then
            exit 1
          fi
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from botw_decomp.verification_report import write_progress

          write_progress(Path(os.environ["PROGRESS_DIR"]), json.loads(os.environ["REPORT"]),
                         os.environ["GITHUB_SHA"], os.environ["GITHUB_RUN_ID"])
          PY
          cd "$progress_dir"
          git add exact-text.svg progress.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Report exact coverage for $GITHUB_SHA"
          git push origin HEAD:refs/heads/progress
