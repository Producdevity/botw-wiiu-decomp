name: Verify reconstructions

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out trusted verifier
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: trusted
          persist-credentials: false
      - name: Check out candidate as data
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate
          persist-credentials: false
      - name: Install PowerPC compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y clang-18 llvm-18 libclang1-18
      - name: Install hash-pinned GHS toolchain
        run: python3 trusted/tools/toolchain.py
      - name: Test trusted verifier
        working-directory: trusted
        env:
          PYTHONPATH: src
        run: PATH="/usr/lib/llvm-18/bin:$PATH" python3 -m unittest discover -s tests -v
      - name: Match candidate sources against trusted references
        working-directory: trusted
        run: python3 tools/ci.py --candidate "$GITHUB_WORKSPACE/candidate" --compiler clang++-18
      - name: Check candidate C++ declarations
        working-directory: trusted
        run: python3 tools/contract_audit.py --root "$GITHUB_WORKSPACE/candidate" --reference-root "$GITHUB_WORKSPACE/trusted" --compiler clang++-18 --strict --summary
      - name: Check semantic-name catalog
        working-directory: trusted
        run: python3 tools/symbols.py --root "$GITHUB_WORKSPACE/candidate" check
