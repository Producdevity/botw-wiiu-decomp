[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "botw-wiiu-decomp"
version = "0.1.0"
description = "Reconstruction and exact matching tools for Breath of the Wild Wii U v208"
requires-python = ">=3.11"
license = "MIT"

[project.scripts]
botw-decomp = "botw_decomp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
